name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: ShellCheck
        run: shellcheck .github/actions/*/*.sh test/*.sh

      - name: Shell tests
        run: |
          bash test/test-action-safety.sh
          bash test/test-detect-license.sh
          bash test/test-generate-platform-pkg.sh
          bash test/test-npm-publish-order.sh
          bash test/test-stage-license.sh

      - name: actionlint
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" rhysd/actionlint:1.7.7
