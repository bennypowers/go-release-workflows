name: Publish to npm

on:
  workflow_call:
    inputs:
      binary-name:
        required: true
        type: string
      npm-package-name:
        description: 'Full npm package name (e.g., "@pwrs/mappa")'
        required: true
        type: string
      release-tag:
        required: true
        type: string
      npm-dir:
        description: 'Directory containing main package.json'
        type: string
        default: 'npm'
      license:
        description: 'SPDX license identifier (defaults to npm-dir/package.json, then repo package.json, then GitHub API)'
        type: string
        default: ''
      license-file:
        description: 'Path to license file copied into each platform package (default: auto-detect in repository root)'
        type: string
        default: ''
      node-version:
        description: 'Node.js version fallback if no .nvmrc/.node-version/package.json engines.node'
        type: string
        default: 'lts/*'
      pre-main-publish-script:
        description: 'Script to run before publishing main package (runs from npm-dir)'
        type: string
        default: ''
      provenance:
        description: 'Publish with provenance (requires id-token: write permission in caller)'
        type: boolean
        default: false
    secrets:
      npm-token:
        required: false

jobs:
  validate-auth:
    name: Validate Auth Config
    runs-on: ubuntu-latest
    steps:
      - name: Require npm-token or provenance
        env:
          HAS_TOKEN: ${{ secrets.npm-token != '' }}
          PROVENANCE: ${{ inputs.provenance }}
        run: |
          if [[ "$PROVENANCE" != "true" && "$HAS_TOKEN" != "true" ]]; then
            echo "::error::Either provenance must be enabled or npm-token secret must be provided"
            exit 1
          fi

      - name: Verify OIDC available in publish job
        if: inputs.provenance
        run: |
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || {
            echo "::error::No OIDC token available in publish job"
            exit 1
          }


  detect-license:
    name: Detect License
    needs: validate-auth
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      license: ${{ steps.license.outputs.license }}
    steps:
      # detect-license reads package.json manifests, so the repo must be checked out.
      # Check out the release tag so backfills read the manifest from that release.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag }}

      - uses: bennypowers/go-release-workflows/.github/actions/detect-license@main
        id: license
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          repository: ${{ github.repository }}
          explicit-license: ${{ inputs.license }}
          npm-dir: ${{ inputs.npm-dir }}

  # npm cannot republish a version. Validate the main package's license before
  # any package ships: two non-empty licenses in npm-dir, a broken symlink, or
  # a license-file name the manifest's files list excludes must fail here, not
  # in publish-main after six platform packages are already on the registry.
  # Staging is repeated in publish-main because staged files do not carry
  # between jobs; this job only validates.
  preflight-license:
    name: Preflight License
    needs: detect-license
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Validate the same release contents that will be published.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag }}

      - uses: bennypowers/go-release-workflows/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}

      - uses: bennypowers/go-release-workflows/.github/actions/stage-license@main
        id: stage
        with:
          npm-dir: ${{ inputs.npm-dir }}
          license-file: ${{ inputs.license-file }}

      - uses: bennypowers/go-release-workflows/.github/actions/verify-license-pack@main
        with:
          npm-dir: ${{ inputs.npm-dir }}
          license-file: ${{ steps.stage.outputs.license-file }}

  publish-platforms:
    name: Publish Platform Package
    needs:
      - detect-license
      - preflight-license
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: linux
            cpu: x64
          - platform: linux-arm64
            os: linux
            cpu: arm64
          - platform: darwin-x64
            os: darwin
            cpu: x64
          - platform: darwin-arm64
            os: darwin
            cpu: arm64
          - platform: win32-x64
            os: win32
            cpu: x64
          - platform: win32-arm64
            os: win32
            cpu: arm64
    steps:
      # License copy and package manifests must match the release being published.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag }}

      - uses: bennypowers/go-release-workflows/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - uses: bennypowers/go-release-workflows/.github/actions/ensure-npm-oidc@main
        if: inputs.provenance

      - uses: bennypowers/go-release-workflows/.github/actions/download-binary@main
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          binary-name: ${{ inputs.binary-name }}
          platform: ${{ matrix.platform }}
          release-tag: ${{ inputs.release-tag }}

      - uses: bennypowers/go-release-workflows/.github/actions/generate-platform-pkg@main
        id: generate
        with:
          binary-name: ${{ inputs.binary-name }}
          platform: ${{ matrix.platform }}
          npm-package-name: ${{ inputs.npm-package-name }}
          release-tag: ${{ inputs.release-tag }}
          license: ${{ needs.detect-license.outputs.license }}
          os: ${{ matrix.os }}
          cpu: ${{ matrix.cpu }}
          repository: ${{ github.repository }}
          license-file: ${{ inputs.license-file }}

      # Trusted publishing (OIDC authentication without NPM_TOKEN) requires
      # npm >= 11.5.1. Provenance signing is older, but authentication is not:
      # npm < 11.5.1 has no OIDC exchange and fails with ENEEDAUTH.
      # ensure-npm-oidc installs an 11.x npm only when the bundled one is too old.

      - name: Verify platform package contents
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          PLATFORM: ${{ matrix.platform }}
          LICENSE_FILE: ${{ steps.generate.outputs.license-file }}
        run: |
          DIR="platforms/${BINARY_NAME}-${PLATFORM}"
          EXT=""
          if [[ "$PLATFORM" == win32-* ]]; then
            EXT=".exe"
          fi
          EXPECTED="${DIR}/${BINARY_NAME}${EXT}"
          if [[ ! -f "$EXPECTED" ]]; then
            echo "::error::Expected binary not found: $EXPECTED"
            echo "Directory contents:"
            ls -la "$DIR"
            exit 1
          fi
          if [[ ! -f "${DIR}/package.json" ]]; then
            echo "::error::package.json not found in $DIR"
            exit 1
          fi
          if [[ -z "$LICENSE_FILE" ]]; then
            echo "::error::generate-platform-pkg did not report a license file"
            exit 1
          fi
          # Assert on the packed file list rather than the generator's output:
          # npm's packlist decides what actually ships (it honors files,
          # .npmignore, and the license auto-include rules).
          PACK_JSON="$(cd "$DIR" && npm pack --dry-run --json --ignore-scripts)"
          PACKED="$(jq -r '.[0].files[].path' <<<"$PACK_JSON")"
          if ! grep -qxF -- "$LICENSE_FILE" <<<"$PACKED"; then
            echo "::error::License file '${LICENSE_FILE}' is missing from the package tarball"
            echo "Packed files:"
            printf '%s\n' "$PACKED"
            exit 1
          fi
          echo "✓ Platform package verified: $(ls "$DIR")"

      - uses: bennypowers/go-release-workflows/.github/actions/npm-publish@main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        with:
          working-directory: platforms/${{ inputs.binary-name }}-${{ matrix.platform }}
          provenance: ${{ inputs.provenance }}

  publish-main:
    name: Publish Main Package
    needs: publish-platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Package contents must match the release being published.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release-tag }}

      - uses: bennypowers/go-release-workflows/.github/actions/setup-node@main
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - uses: bennypowers/go-release-workflows/.github/actions/ensure-npm-oidc@main
        if: inputs.provenance

      - uses: bennypowers/go-release-workflows/.github/actions/stage-license@main
        id: stage
        with:
          npm-dir: ${{ inputs.npm-dir }}
          license-file: ${{ inputs.license-file }}

      - name: Run pre-publish script
        if: inputs.pre-main-publish-script != ''
        working-directory: ${{ inputs.npm-dir }}
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: ${{ inputs.pre-main-publish-script }} # action-safety: ignore -- caller script by design

      - name: Update version
        working-directory: ${{ inputs.npm-dir }}
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Same shared check the preflight runs, so the published contents are
      # validated again after the version update and pre-publish script.
      - uses: bennypowers/go-release-workflows/.github/actions/verify-license-pack@main
        with:
          npm-dir: ${{ inputs.npm-dir }}
          license-file: ${{ steps.stage.outputs.license-file }}

      - uses: bennypowers/go-release-workflows/.github/actions/npm-publish@main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        with:
          working-directory: ${{ inputs.npm-dir }}
          provenance: ${{ inputs.provenance }}
