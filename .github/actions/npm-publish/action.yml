name: npm Publish
description: Publish npm package with idempotency (skip if already published)

inputs:
  working-directory:
    description: 'Directory containing package.json'
    required: false
    default: '.'
  provenance:
    description: 'Publish with --provenance (requires OIDC id-token)'
    required: false
    default: false

runs:
  using: composite
  steps:
    - env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        NPM_PROVENANCE: ${{ inputs.provenance }}
      run: |
        "${{ github.action_path }}/npm-publish.sh" "$WORKING_DIRECTORY"
      shell: bash
