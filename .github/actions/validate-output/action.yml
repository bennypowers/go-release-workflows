name: Validate Output
description: Validate that the build produced the expected binary

inputs:
  binary-name:
    description: 'Name of the binary'
    required: true
  platform:
    description: 'Target platform'
    required: true
  windows:
    description: 'Set to "true" for Windows binaries (.exe)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - env:
        BINARY_NAME: ${{ inputs.binary-name }}
        PLATFORM: ${{ inputs.platform }}
        WINDOWS: ${{ inputs.windows }}
      run: |
        "${{ github.action_path }}/validate-output.sh" "$BINARY_NAME" "$PLATFORM" "$WINDOWS"
      shell: bash
