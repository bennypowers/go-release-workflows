name: Download Binary
description: Download binary from GitHub release

inputs:
  binary-name:
    description: 'Name of the binary'
    required: true
  platform:
    description: 'Target platform'
    required: true
  release-tag:
    description: 'GitHub release tag'
    required: true

runs:
  using: composite
  steps:
    - env:
        BINARY_NAME: ${{ inputs.binary-name }}
        PLATFORM: ${{ inputs.platform }}
        RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        "${{ github.action_path }}/download-binary.sh" "$BINARY_NAME" "$PLATFORM" "$RELEASE_TAG"
      shell: bash
