name: Generate Platform Package
description: Generate platform-specific package.json for npm

inputs:
  binary-name:
    description: 'Name of the binary'
    required: true
  platform:
    description: 'Target platform'
    required: true
  npm-package-name:
    description: 'Full npm package name (e.g., @scope/myapp)'
    required: true
  release-tag:
    description: 'GitHub release tag'
    required: true
  license:
    description: 'SPDX license identifier'
    required: true
  os:
    description: 'Platform OS (linux, darwin, win32)'
    required: true
  cpu:
    description: 'Platform CPU (x64, arm64)'
    required: true
  repository:
    description: 'GitHub repository (owner/repo)'
    required: true
  license-file:
    description: 'Path to license file to copy (default: auto-detect LICENSE/LICENCE/COPYING in the repository root)'
    required: false
    default: ''

outputs:
  license-file:
    description: 'Basename of the license file copied into the platform package'
    value: ${{ steps.generate.outputs.license-file }}

runs:
  using: composite
  steps:
    - id: generate
      env:
        BINARY_NAME: ${{ inputs.binary-name }}
        PLATFORM: ${{ inputs.platform }}
        NPM_PACKAGE_NAME: ${{ inputs.npm-package-name }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        LICENSE: ${{ inputs.license }}
        PLATFORM_OS: ${{ inputs.os }}
        PLATFORM_CPU: ${{ inputs.cpu }}
        REPOSITORY: ${{ inputs.repository }}
        LICENSE_FILE: ${{ inputs.license-file }}
      run: |
        "${{ github.action_path }}/generate-platform-pkg.sh" \
          "$BINARY_NAME" \
          "$PLATFORM" \
          "$NPM_PACKAGE_NAME" \
          "$RELEASE_TAG" \
          "$LICENSE" \
          "$PLATFORM_OS" \
          "$PLATFORM_CPU" \
          "$REPOSITORY" \
          "$LICENSE_FILE"
      shell: bash
