name: License lint

# Reusable workflow for consuming repositories. Add it to CI so a missing or
# inconsistent license fails a normal test run instead of the release:
#
#   jobs:
#     license-lint:
#       uses: bennypowers/go-release-workflows/.github/workflows/license-lint.yml@v2
#       with:
#         npm-dir: npm
#
# It runs the same checks the publish workflow enforces, offline: the license
# file exists and is non-empty, the main package manifest carries a valid SPDX
# expression consistent with any explicit license input, and every generated
# platform package ships the license as a real file listed in its published
# tarball. The main package check stages the license into a temporary copy of
# npm-dir before packing, so it validates the canonical release layout where
# the license does not exist until stage-license runs.

on:
  workflow_call:
    inputs:
      npm-dir:
        description: 'Directory holding the main package.json'
        type: string
        required: false
        default: 'npm'
      license-file:
        description: 'Path to the license file the release publishes'
        type: string
        required: false
        default: ''
      license:
        description: 'SPDX expression; defaults to npm-dir/package.json'
        type: string
        required: false
        default: ''
      platforms-dir:
        description: 'Directory holding generated platform packages'
        type: string
        required: false
        default: 'platforms'
      npm:
        description: 'auto lints npm packages when present, required fails without them, none skips npm checks'
        type: string
        required: false
        default: 'auto'
      node-version:
        description: 'Node.js version used for npm pack checks'
        type: string
        required: false
        default: 'lts/*'
    outputs:
      license:
        description: 'SPDX expression the release would publish'
        value: ${{ jobs.license-lint.outputs.license }}
      license-file:
        description: 'Basename of the license file the release would publish'
        value: ${{ jobs.license-lint.outputs.license-file }}
      platform-packages:
        description: 'Number of platform packages checked'
        value: ${{ jobs.license-lint.outputs.platform-packages }}

permissions:
  contents: read

jobs:
  license-lint:
    name: License lint
    runs-on: ubuntu-latest
    outputs:
      license: ${{ steps.lint.outputs.license }}
      license-file: ${{ steps.lint.outputs.license-file }}
      platform-packages: ${{ steps.lint.outputs.platform-packages }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      # A cross-repository reusable workflow resolves relative paths against
      # the caller's checkout. Reference the action by its full repository path
      # so external consumers, which do not have this repository's actions in
      # their checkout, still run it.
      #
      # The reference stays on the major tag. `uses` does not accept
      # expressions, and a reusable workflow does not receive its caller's
      # github.action_ref, so the action cannot follow a patch tag the caller
      # pinned. Bump this line with the workflow's major version.
      - id: lint
        name: Lint license compliance
        uses: bennypowers/go-release-workflows/.github/actions/license-lint@v2
        with:
          npm-dir: ${{ inputs.npm-dir }}
          license-file: ${{ inputs.license-file }}
          license: ${{ inputs.license }}
          platforms-dir: ${{ inputs.platforms-dir }}
          npm: ${{ inputs.npm }}
