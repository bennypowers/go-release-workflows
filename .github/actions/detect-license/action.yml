name: Detect License
description: Detect repository license (explicit input, package.json, then GitHub API)

inputs:
  repository:
    description: 'Repository in owner/repo format'
    required: true
  explicit-license:
    description: 'Explicit SPDX license identifier (overrides detection)'
    required: false
    default: ''
  npm-dir:
    description: 'Directory containing the main package.json'
    required: false
    default: 'npm'

outputs:
  license:
    description: 'Detected or explicit SPDX license identifier'
    value: ${{ steps.detect.outputs.license }}

runs:
  using: composite
  steps:
    - id: detect
      env:
        REPOSITORY: ${{ inputs.repository }}
        EXPLICIT_LICENSE: ${{ inputs.explicit-license }}
        NPM_DIR: ${{ inputs.npm-dir }}
      run: |
        "${{ github.action_path }}/detect-license.sh" "$REPOSITORY" "$EXPLICIT_LICENSE" "$NPM_DIR"
      shell: bash
